name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: web/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web frontend
        run: cd web && npx vite build

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'LocalBolt v__VERSION__'
          releaseBody: |
            ## Download

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `LocalBolt_x.x.x_aarch64.dmg` |
            | macOS (Intel) | `LocalBolt_x.x.x_x64.dmg` |
            | Windows | `LocalBolt_x.x.x_x64-setup.exe` |
            | Linux (Debian/Ubuntu) | `LocalBolt_x.x.x_amd64.deb` |
            | Linux (Fedora/RHEL) | `LocalBolt-x.x.x-1.x86_64.rpm` |

            ### Installation Notes

            **macOS (unsigned):** Right-click the app → Open → click "Open" to bypass Gatekeeper.
            **Windows (unsigned):** Click "More info" → "Run anyway" on the SmartScreen prompt.
            **Linux:** `sudo dpkg -i LocalBolt_*.deb` or `sudo rpm -i LocalBolt-*.rpm`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
