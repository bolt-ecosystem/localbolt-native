name: Windows CI (legacy surfaces)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal-server:
    name: Signal Server (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: signal
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test -- --nocapture
      - run: cargo build --release

  tauri-retired:
    name: Tauri App Retired Guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Confirm retired Tauri surface is not a forward CI gate
        shell: pwsh
        run: |
          Write-Host "src-tauri is retired and frozen."
          Write-Host "Forward Windows shell CI requires a native/windows implementation decision."

  web-app:
    name: Web App (TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Web tests + coverage
        run: npm run test:coverage
      - run: npm run build
