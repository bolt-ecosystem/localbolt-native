name: Windows CI (legacy surfaces)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal-server:
    name: Signal Server (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: signal
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test -- --nocapture
      - run: cargo build --release

  tauri-retired:
    name: Tauri App Retired Guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Confirm retired Tauri surface is not a forward CI gate
        shell: pwsh
        run: |
          Write-Host "src-tauri is retired and frozen."
          Write-Host "Forward Windows shell CI requires a native/windows implementation decision."

  web-app:
    name: Web App (TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Web tests + coverage
        run: npm run test:coverage
      - run: npm run build
