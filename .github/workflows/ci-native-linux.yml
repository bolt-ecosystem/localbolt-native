name: CI — Native Linux CLI

on:
  push:
    paths:
      - 'native/linux/**'
      - '.github/workflows/ci-native-linux.yml'
    branches: [main]
  pull_request:
    paths:
      - 'native/linux/**'
      - '.github/workflows/ci-native-linux.yml'
    branches: [main]

jobs:
  linux-cli:
    name: Build & Test localbolt-cli
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # bolt-core-sdk is a sibling repo needed for Cargo path deps.
      # actions/checkout refuses paths outside workspace, so use git clone.
      # Cargo.toml: ../../../../bolt-core-sdk/rust/... resolves to ../bolt-core-sdk
      # relative to the workspace root.
      - name: Clone bolt-core-sdk (sibling dependency)
        run: git clone --depth 1 https://github.com/the9ines/bolt-core-sdk.git "${{ github.workspace }}/../bolt-core-sdk"

      - name: cargo fmt
        working-directory: native/linux/cli
        run: cargo fmt -- --check

      - name: cargo clippy
        working-directory: native/linux/cli
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: native/linux/cli
        run: cargo test

      - name: cargo build (release)
        working-directory: native/linux/cli
        run: cargo build --release

      - name: Verify binary
        run: |
          file native/linux/cli/target/release/localbolt-cli
          native/linux/cli/target/release/localbolt-cli --version
