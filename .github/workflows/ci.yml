name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signal-server:
    name: Signal Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: signal
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release

  tauri-app:
    name: Tauri App (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  web-app:
    name: Web App (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Registry mapping guard (D5)
        working-directory: .
        run: bash scripts/check-registry-mapping.sh
      - name: Transport version pin guard
        working-directory: .
        run: bash scripts/check-transport-version-pin.sh
      - name: Core version pin guard
        working-directory: .
        run: bash scripts/check-core-version-pin.sh
      - run: npm ci
      - name: Lockfile registry guard (D5)
        working-directory: .
        run: bash scripts/check-lockfile-registry.sh
      - name: Transport single-install guard
        working-directory: .
        run: bash scripts/check-transport-single-install.sh
      - name: Core single-install guard
        working-directory: .
        run: bash scripts/check-core-single-install.sh
      - name: Web tests + coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Transport drift guard
        run: bash ../scripts/check-transport-drift.sh src
      - name: Core drift guard
        run: bash ../scripts/check-core-drift.sh src
