name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signal-server:
    name: Signal Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: signal
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release

  native-shared:
    name: Native Shared Bridge (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # native/shared uses sibling path deps:
      # ../../../bolt-core-sdk/rust/... resolves to ../bolt-core-sdk in CI.
      - name: Clone bolt-core-sdk (sibling dependency)
        run: git clone --depth 1 https://github.com/bolt-ecosystem/bolt-core-sdk.git "${{ github.workspace }}/../bolt-core-sdk"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: native/shared
      # FFI exports intentionally accept raw C pointers; cleanup of the advisory
      # clippy/warning backlog is tracked separately from this CI realignment.
      - run: cargo clippy -- -A clippy::not_unsafe_ptr_arg_deref
      - run: cargo test
      - run: cargo build --release

  native-macos:
    name: Native macOS Shell (SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone bolt-core-sdk (sibling dependency)
        run: git clone --depth 1 https://github.com/bolt-ecosystem/bolt-core-sdk.git "${{ github.workspace }}/../bolt-core-sdk"
      - name: Build native bridge archive
        working-directory: native/shared
        run: cargo build --release
      - name: Build SwiftUI shell
        working-directory: native/macos
        run: swift build -c release
      # `swift build` only produces a bare executable. The shipped app resolves
      # bolt-daemon next to its own executable, so a bundle assembled without the
      # sidecar is broken at runtime while every build step still passes. Package
      # the real .app and assert the sidecar landed.
      # build-app.sh builds the daemon from ../../../bolt-daemon, which is this
      # sibling checkout; bolt-daemon in turn path-depends on ../bolt-core-sdk,
      # already cloned above at the same level.
      - name: Clone bolt-daemon (app bundle sidecar)
        run: git clone --depth 1 https://github.com/bolt-ecosystem/bolt-daemon.git "${{ github.workspace }}/../bolt-daemon"
      - name: Package LocalBolt.app
        working-directory: native/macos
        # Ad-hoc signs (CODESIGN_IDENTITY defaults to "-"); no Developer ID needed.
        # Architecture, static-link and codesign checks already run inside the script.
        run: bash build-app.sh release
      - name: Verify .app bundle ships a usable daemon sidecar
        working-directory: native/macos
        run: |
          set -euo pipefail
          APP="build/LocalBolt.app"
          test -d "$APP" || { echo "::error::missing bundle $APP"; exit 1; }
          test -x "$APP/Contents/MacOS/LocalBolt" || { echo "::error::missing app executable"; exit 1; }
          test -x "$APP/Contents/MacOS/bolt-daemon" || { echo "::error::missing bolt-daemon sidecar"; exit 1; }
          echo "bundle OK: $(ls -1 "$APP/Contents/MacOS" | tr '\n' ' ')"

  subtree-drift-guard:
    name: Signal Subtree Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Read subtree pin
        shell: bash
        run: |
          set -euo pipefail
          source SIGNAL_SUBTREE_PIN
          echo "UPSTREAM_REPO=$UPSTREAM_REPO" >> "$GITHUB_ENV"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"

      - name: Checkout canonical bolt-rendezvous
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: canonical-rendezvous
          fetch-depth: 1

      - name: Sanity check canonical
        run: test -f canonical-rendezvous/Cargo.toml

      - name: Verify signal subtree
        run: CANONICAL_DIR="$GITHUB_WORKSPACE/canonical-rendezvous" bash scripts/verify_signal_subtree.sh
