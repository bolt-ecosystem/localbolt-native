[package]
name = "bolt-native-bridge"
version = "0.1.0"
edition = "2021"
description = "C-ABI FFI bridge from bolt-app-core to native platform shells"

[lib]
name = "bolt_native_bridge"
crate-type = ["staticlib", "cdylib"]

[dependencies]
bolt-app-core = { path = "../../../bolt-core-sdk/rust/bolt-app-core" }
bolt-core = { path = "../../../bolt-core-sdk/rust/bolt-core" }
serde_json = "1"
