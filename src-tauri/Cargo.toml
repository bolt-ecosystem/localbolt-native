[package]
name = "localbolt-app"
version = "1.0.0"
edition = "2021"
description = "LocalBolt — Encrypted P2P File Transfer"

[lib]
name = "localbolt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
bolt-rendezvous = { path = "../signal" }
bolt-app-core = { path = "../../bolt-core-sdk/rust/bolt-app-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
